# billsplit.arcan.uz — Bill Splitter (Telegram Mini App + bot API)
#
# Everything is reverse-proxied to the Bun process (src/server), which serves
# BOTH the built SPA (webapp/dist) and the JSON API under /api from one origin.
#
# There is deliberately no `root` / `try_files` here, unlike the sibling projects'
# vhosts: the app owns its cache policy (no-cache on index.html, immutable on
# /assets/*, no-store on /health) and /health reports the dist it is actually
# serving. Re-implementing any of that in nginx would fork the source of truth
# for the stale-bundle check. See docs/versioning.md.
#
# Install:
#   sudo cp billsplit.arcan.uz.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/billsplit.arcan.uz.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then HTTPS (required by Telegram — it refuses to load a Mini App over http):
#   sudo certbot --nginx -d billsplit.arcan.uz
# certbot rewrites this file IN PLACE, adding `listen 443 ssl`, the certificate
# paths and an 80→443 redirect block. Renewal rides the existing certbot timer
# shared with vision.arcan.uz / beta.arcan.uz.

upstream billsplit_app {
    # Must match PORT in the server-side .env. 3000 (global-go), 3001 (Arcan
    # prod) and 3002 (Arcan beta) are already taken on this box.
    server 127.0.0.1:3003;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name billsplit.arcan.uz;

    # MAX_UPLOAD_BYTES is 5_000_000. nginx defaults to 1m and would answer a
    # receipt upload with its own HTML 413 before the app ever sees it — and the
    # SPA expects JSON. 10m leaves room for multipart overhead.
    client_max_body_size 10m;

    # The Bun server compresses nothing, and the main bundle is ~300 KB of JS
    # plus ~235 KB of CSS. text/javascript is NOT optional here: Bun labels .js
    # that way, so a gzip_types list carrying only `application/javascript` (as
    # the sibling vhosts have) would leave the main bundle uncompressed.
    # woff/woff2 are already compressed and are deliberately absent.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml;

    # Low-volume, and the SPA polls it on launch and on resume for the
    # stale-bundle check — keep it out of the access log.
    location = /health {
        access_log off;
        proxy_pass http://billsplit_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # NO trailing slash. This form passes the URI through untouched.
        # `proxy_pass http://127.0.0.1:3003/;` — the form both sibling vhosts use
        # — would rewrite /api/me to /me, which misses the /api/ branch in
        # src/server/index.ts, falls through to the SPA fallback, and returns
        # 200 text/html for every API call. Every route breaks, and it breaks as
        # a success status. The deploy workflow asserts GET /api/me returns 401
        # precisely to catch this.
        proxy_pass http://billsplit_app;

        proxy_http_version 1.1;
        # Empty Connection header keeps the upstream connection alive. Do NOT
        # copy the siblings' `Connection "upgrade"` — this app has no WebSocket,
        # so that would send a bogus hop-by-hop header on every request and
        # disable keepalive.
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Receipt scanning calls Gemini inline from the request handler, and
        # Bun.serve runs with idleTimeout: 120. nginx's 60s default would turn a
        # slow scan into a 504 while the app is still working.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Deliberately no `expires` / `add_header Cache-Control` anywhere in this
        # file: nginx APPENDS add_header rather than replacing the upstream's, so
        # any rule here yields two Cache-Control headers and breaks the app's
        # contract — including the no-cache on index.html that makes a plain
        # location.reload() trustworthy.
    }

    # Do NOT add X-Frame-Options or a CSP frame-ancestors rule: the Mini App is
    # loaded inside Telegram's webview and framing restrictions break it.
}
