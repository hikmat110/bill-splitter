services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bill_splitter
      POSTGRES_USER: bill
      POSTGRES_PASSWORD: bill
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bill -d bill_splitter"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
